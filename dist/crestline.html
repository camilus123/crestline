  --txt:#f4f0ff; --dim:#9b8fc7; --panel:rgba(16,8,44,.74); --panel2:rgba(28,14,70,.82);
  --fs:clamp(13px, calc(1.05vh + .32vw), 30px);
}
#ui{font-family:'Chakra Petch',system-ui,sans-serif;font-size:var(--fs);color:var(--txt);user-select:none;-webkit-user-select:none}
#ui *{box-sizing:border-box}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:auto;opacity:0;transform:translateY(1.2rem);transition:opacity .28s ease,transform .32s cubic-bezier(.2,.8,.2,1)}
.scr.on{opacity:1;transform:none}
.scr.bg{background:radial-gradient(120% 90% at 50% 110%,rgba(255,42,109,.28),transparent 60%),linear-gradient(180deg,rgba(6,3,20,.55),rgba(6,3,20,.82))}
.scan:after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.disp{font-family:'Russo One','Chakra Petch',sans-serif;letter-spacing:.04em;text-transform:uppercase}
.mono{font-family:'Share Tech Mono',monospace}
.logo{font-family:'Russo One',sans-serif;font-style:italic;line-height:.9;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 0%,#dff6ff 38%,#5a7bd8 48%,#141048 52%,#ff6ab0 70%,#ffd9a0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .08em 0 #05d9e8) drop-shadow(0 .16em 0 #ff2a6d) drop-shadow(0 .35em .6em rgba(0,0,0,.7));
  transform:skewX(-8deg)}
.logo.big{font-size:min(13vw,24vh)}
.sub{font-family:'Russo One',sans-serif;letter-spacing:.6em;color:var(--sun);text-shadow:0 0 .6em rgba(255,159,28,.6)}
.hdr{display:flex;align-items:center;gap:1.2rem;padding:1.4rem 2.4rem .6rem}
.hdr .logo{font-size:2.6rem}
.hdr .ttl{font-family:'Russo One';font-size:1.25rem;letter-spacing:.35em;color:var(--cyan);border-left:3px solid var(--mag);padding-left:1rem}
.body{flex:1;display:flex;gap:1.6rem;padding:1rem 2.4rem;min-height:0}
.col{flex:1;display:flex;flex-direction:column;gap:.55rem;min-width:0}
.panel{background:var(--panel);border:1px solid rgba(5,217,232,.25);border-radius:2px;padding:1rem 1.2rem;position:relative;backdrop-filter:blur(6px);
  box-shadow:0 0 0 1px rgba(255,42,109,.15) inset,0 1rem 2.4rem rgba(0,0,0,.45);clip-path:polygon(0 0,calc(100% - 1rem) 0,100% 1rem,100% 100%,1rem 100%,0 calc(100% - 1rem))}
.panel h3{margin:0 0 .6rem;font-family:'Russo One';font-weight:400;font-size:.95rem;letter-spacing:.3em;color:var(--mag)}
.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.48rem .8rem;border:1px solid transparent;position:relative;cursor:pointer;
  transition:background .12s,border-color .12s,transform .12s;min-height:2.3rem}
.row .lab{color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-size:.82rem;font-weight:600}
.row .val{font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:.5rem;text-transform:uppercase}
.row .val .ar{color:var(--cyan);opacity:.45;font-family:'Russo One';transition:opacity .12s}
.row.f{background:linear-gradient(90deg,rgba(5,217,232,.22),rgba(255,42,109,.12));border-color:var(--cyan);transform:translateX(.3rem)}
.row.f:before{content:'';position:absolute;left:-.8rem;top:50%;width:0;height:0;border:.45rem solid transparent;border-left-color:var(--cyan);transform:translateY(-50%);filter:drop-shadow(0 0 .3em var(--cyan))}
.row.f .val .ar{opacity:1}
.row.f .lab{color:#fff}
.row.dis{opacity:.32;pointer-events:none}
.chips{display:flex;gap:.25rem}
.chip{padding:.12rem .55rem;border:1px solid rgba(155,143,199,.35);font-size:.8rem;color:var(--dim);transform:skewX(-12deg)}
.chip.on{background:var(--mag);border-color:var(--mag);color:#fff;box-shadow:0 0 .8em rgba(255,42,109,.6)}
.btn{display:flex;align-items:center;justify-content:center;font-family:'Russo One';letter-spacing:.2em;text-transform:uppercase;font-size:1rem;
  padding:.75rem 1.4rem;background:linear-gradient(180deg,rgba(40,22,100,.9),rgba(18,8,52,.9));border:1px solid rgba(5,217,232,.35);cursor:pointer;transform:skewX(-10deg);
  transition:all .12s;color:var(--txt)}
.btn>span{transform:skewX(10deg)}
.btn.f{background:linear-gradient(180deg,#ff2a6d,#b0124c);border-color:#fff;box-shadow:0 0 1.2rem rgba(255,42,109,.8),0 0 0 2px rgba(255,255,255,.4) inset;transform:skewX(-10deg) scale(1.04)}
.btn.go{font-size:1.6rem;padding:1.1rem 1.6rem;background:linear-gradient(180deg,#ffb23f,#ff5a1c);color:#1a0820;border-color:#ffe6a0}
.btn.go.f{background:linear-gradient(180deg,#fff0a0,#ff9f1c);box-shadow:0 0 1.6rem rgba(255,159,28,.9)}
input.txt,textarea.txt{font:inherit;font-weight:700;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(5,217,232,.4);padding:.25rem .5rem;outline:none;letter-spacing:.1em;text-transform:uppercase;min-width:0}
input.txt:focus,textarea.txt:focus{border-color:var(--gold);box-shadow:0 0 .6em rgba(255,210,63,.5)}
textarea.txt{width:100%;height:5.5rem;resize:none;font-family:'Share Tech Mono';font-size:.9rem}
.hint{padding:.7rem 2.4rem 1.2rem;color:var(--dim);font-size:.78rem;letter-spacing:.12em;display:flex;gap:2rem;text-transform:uppercase}
.hint b{color:var(--cyan);font-weight:700}
.info{font-size:.82rem;color:var(--dim);line-height:1.5;letter-spacing:.04em}
.info b{color:var(--txt)}
.bar{height:.55rem;background:rgba(255,255,255,.08);position:relative;overflow:hidden;transform:skewX(-20deg)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cyan),var(--mag));box-shadow:0 0 .6em var(--cyan)}
.slider{width:11rem;height:.5rem;background:rgba(255,255,255,.1);position:relative;transform:skewX(-20deg)}
.slider i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--mag),var(--sun))}
.slider em{position:absolute;top:-.35rem;width:.4rem;height:1.2rem;background:#fff;box-shadow:0 0 .5em #fff}
.pill{font-family:'Russo One';font-size:.72rem;letter-spacing:.2em;padding:.18rem .6rem;background:var(--mag);color:#fff;transform:skewX(-12deg);display:inline-block}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pop{0%{transform:scale(1.8);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(40%);opacity:0}100%{transform:none;opacity:1}}

/* title */
.title{align-items:center;justify-content:center;text-align:center}
.title .press{margin-top:4vh;font-family:'Russo One';letter-spacing:.5em;font-size:1.2rem;color:#fff;text-shadow:0 0 .8em var(--mag)}
.title .foot{position:absolute;bottom:2.4vh;left:0;right:0;color:var(--dim);font-size:.75rem;letter-spacing:.3em}
.title .shine{position:relative}
.title .shine:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);background-size:200% 100%;animation:sweep 3.6s linear infinite;mix-blend-mode:overlay;pointer-events:none}

/* CD player */
.cd{position:relative;width:min(48vh,26vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#0a0620 0 9%,#c8d0e0 9.5% 11%,transparent 11.5%),conic-gradient(from 0deg,#e8f0ff,#ff9ad0,#a0e8ff,#ffe8a0,#d0a0ff,#a0ffd8,#e8f0ff);
  box-shadow:0 0 0 .4rem rgba(255,255,255,.12),0 1.5rem 3rem rgba(0,0,0,.6),0 0 4rem rgba(5,217,232,.25) inset}
.cd:before{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
.cd:after{content:'CRESTLINE';position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:'Russo One';font-style:italic;color:#140b34;font-size:1.2rem;letter-spacing:.2em;opacity:.65}
.cd.play{animation:spin 1.8s linear infinite}
.lcd{font-family:'Share Tech Mono';background:#0b2a1e;color:#7cff9f;padding:1rem 1.2rem;border:2px solid #2a5a3e;box-shadow:0 0 1.2rem rgba(124,255,159,.2) inset;text-shadow:0 0 .4em #7cff9f;letter-spacing:.12em}
.lcd .big{font-size:2.6rem;line-height:1}
.eq{display:flex;gap:3px;align-items:flex-end;height:2.4rem;margin-top:.5rem}
.eq i{flex:1;background:linear-gradient(0deg,#7cff9f,#ffd23f 70%,#ff2a6d);transition:height .08s}

/* car select */
.cars{position:absolute;inset:0;display:flex;flex-direction:column}
.carname{font-family:'Russo One';font-style:italic;font-size:3.6rem;line-height:1;transform:skewX(-8deg);text-shadow:0 .1em 0 var(--mag),0 0 1em rgba(5,217,232,.4)}
.carmake{font-family:'Russo One';letter-spacing:.5em;color:var(--cyan)}
.stat{display:grid;grid-template-columns:9rem 1fr 6rem;align-items:center;gap:1rem;margin:.45rem 0;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em}
.stat .bar{height:.75rem}
.swatches{display:flex;gap:.5rem;margin-top:.8rem}
.swatches i{width:1.8rem;height:1.8rem;transform:skewX(-12deg);border:2px solid transparent}
.swatches i.on{border-color:#fff;box-shadow:0 0 .8em #fff}

/* grid / results tables */
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t td,table.t th{padding:.28rem .6rem;text-align:left;white-space:nowrap}
table.t th{color:var(--dim);font-weight:600;letter-spacing:.15em;font-size:.72rem;text-transform:uppercase;border-bottom:1px solid rgba(5,217,232,.3)}
table.t tr:nth-child(even) td{background:rgba(255,255,255,.03)}
table.t tr.me td{background:linear-gradient(90deg,rgba(255,42,109,.45),rgba(255,42,109,.08));color:#fff;font-weight:700}
table.t tr.cut td{border-top:2px dashed var(--sun)}
.sw{display:inline-block;width:.8rem;height:.8rem;transform:skewX(-12deg);margin-right:.5rem;vertical-align:-.05rem}
.gridslots{display:grid;grid-template-columns:1fr 1fr;gap:.35rem 1.4rem}
.slot{display:flex;align-items:center;gap:.7rem;padding:.3rem .7rem;background:rgba(255,255,255,.04);font-size:.85rem;animation:rise .4s both}
.slot:nth-child(even){margin-top:1.1rem}
.slot .n{font-family:'Russo One';color:var(--dim);width:1.6rem}
.slot.me{background:linear-gradient(90deg,rgba(255,42,109,.55),rgba(255,42,109,.1));font-weight:700}

/* HUD */
.hud{position:absolute;pointer-events:none;font-family:'Russo One';color:#fff;overflow:hidden}
.hud .tl{position:absolute;left:2.2%;top:4%}
.hud .tc{position:absolute;left:50%;top:3%;transform:translateX(-50%);text-align:center}
.hud .tr{position:absolute;right:2.2%;top:4%;text-align:right}
.hud .bl{position:absolute;left:2.2%;bottom:5%}
.hud .br{position:absolute;right:2.2%;bottom:5%;text-align:right}
.hud .lbl{font-size:.7em;letter-spacing:.3em;color:var(--cyan);text-shadow:0 0 .5em rgba(5,217,232,.8)}
.hud .pos{font-size:3.4em;line-height:.95;font-style:italic;text-shadow:.06em .06em 0 var(--mag),0 0 .6em rgba(0,0,0,.6)}
.hud .pos small{font-size:.42em;color:var(--dim);font-style:normal}
.hud .time{font-family:'Share Tech Mono';font-size:3.6em;line-height:.9;text-shadow:0 0 .4em rgba(255,159,28,.6),.05em .05em 0 #000;color:var(--gold)}
.hud .time.low{color:#ff3a3a;animation:blink .5s steps(2) infinite}
.hud .score{font-family:'Share Tech Mono';font-size:2em;text-shadow:.05em .05em 0 #000}
.hud .spd{font-family:'Share Tech Mono';font-size:4.6em;line-height:.85;font-style:italic;text-shadow:.05em .05em 0 var(--mag),0 0 .5em rgba(0,0,0,.6)}
.hud .spd small{font-size:.3em;font-family:'Russo One';color:var(--cyan);letter-spacing:.2em;font-style:normal}
.hud .gear{display:inline-block;font-size:2.4em;width:1.5em;text-align:center;background:rgba(10,6,32,.7);border:2px solid var(--cyan);margin-left:.4em;transform:skewX(-10deg);font-style:italic}
.hud .gear.m{border-color:var(--sun)}
.hud .rev{display:flex;gap:.12em;margin-top:.4em;height:1.15em;justify-content:flex-end}
.hud .rev i{width:.62em;background:rgba(255,255,255,.12);transform:skewX(-18deg)}
.hud .rev i.l{background:#3aff7a;box-shadow:0 0 .4em #3aff7a}
.hud .rev i.l.y{background:#ffd23f;box-shadow:0 0 .4em #ffd23f}
.hud .rev i.l.r{background:#ff2a4a;box-shadow:0 0 .5em #ff2a4a}
.hud .rev i.z{outline:1px solid rgba(124,255,79,.55)}
.hud .rev.lim i.l{animation:blink .1s steps(2) infinite}
.hud .fuel{width:12em;margin-top:.5em}
.hud .fuel .bar{height:.8em}
.hud .fuel .bar i{background:linear-gradient(90deg,#ff3a3a,#ffd23f 30%,#3aff7a)}
.hud .prog{position:absolute;left:24%;right:24%;bottom:2.2%;height:.45em;background:rgba(255,255,255,.1);transform:skewX(-20deg)}
.hud .prog i{position:absolute;top:-.25em;width:.3em;height:.95em;background:#fff;opacity:.6}
.hud .prog i.me{background:var(--mag);opacity:1;height:1.3em;top:-.42em;box-shadow:0 0 .6em var(--mag)}
.hud .prog b{position:absolute;top:-.1em;width:2px;height:.65em;background:var(--gold)}
.hud .msg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:4.2em;font-style:italic;text-shadow:.06em .06em 0 var(--mag),0 0 .8em rgba(0,0,0,.7);animation:pop .35s both}
.hud .msg small{display:block;font-size:.35em;letter-spacing:.3em;color:var(--gold);font-style:normal;margin-top:.3em}
.hud .gap{font-family:'Share Tech Mono';font-size:1.4em;margin-top:.3em;padding:.1em .5em;background:rgba(10,6,32,.65);display:inline-block}
.hud .gap.up{color:#3aff7a}.hud .gap.dn{color:#ff6a6a}
.hud .tag{display:inline-block;font-size:.8em;letter-spacing:.25em;padding:.2em .7em;background:var(--sun);color:#1a0820;transform:skewX(-12deg);margin-top:.4em}
.hud .lights{position:absolute;left:50%;top:14%;transform:translateX(-50%);display:flex;gap:1em}
.hud .lights i{width:2.4em;height:2.4em;border-radius:50%;background:#2a0a14;border:.2em solid #111;box-shadow:0 .2em .6em #000}
.hud .lights i.on{background:radial-gradient(circle at 40% 35%,#ff8a8a,#ff1a1a 60%,#8a0000);box-shadow:0 0 1.4em #ff2a2a}
.hud .lights.go i{background:radial-gradient(circle at 40% 35%,#c8ffb0,#3aff3a 60%,#0a7a00);box-shadow:0 0 1.4em #3aff3a}
.split{position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--mag),var(--cyan),var(--mag));box-shadow:0 0 1rem var(--mag);pointer-events:none}
.f3{position:fixed;right:.6rem;top:.6rem;font:12px/1.35 'Share Tech Mono',monospace;color:#7cff9f;background:rgba(0,0,0,.65);padding:.4rem .6rem;white-space:pre;pointer-events:none;z-index:50;border:1px solid #2a5a3e}
.benchbar{position:fixed;left:50%;bottom:9%;white-space:nowrap;transform:translateX(-50%);font:700 15px/1 'Share Tech Mono',monospace;letter-spacing:.12em;color:#ffd23f;background:rgba(0,0,0,.6);padding:.45rem .9rem;border:1px solid rgba(255,210,63,.5);pointer-events:none;z-index:55}
.toast{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--cyan);padding:.6rem 1.2rem;font-weight:700;letter-spacing:.1em;pointer-events:none;z-index:60;animation:rise .25s both}
.mapbox{position:relative;flex:1;min-height:0}
.mapbox canvas{width:100%;height:100%;display:block}
.code{font-family:'Share Tech Mono';font-size:2.2rem;letter-spacing:.18em;color:var(--gold);text-shadow:0 0 .5em rgba(255,210,63,.5)}
.keys{display:grid;grid-template-columns:auto 1fr 1fr;gap:.2rem .8rem;font-size:.82rem;align-items:center}
.kb{display:inline-block;padding:.05rem .4rem;margin:.1rem .2rem .1rem 0;border:1px solid rgba(5,217,232,.5);font-family:'Share Tech Mono';font-size:.78rem;background:rgba(0,0,0,.3)}
body.nocursor,body.nocursor *{cursor:none!important}
.title .ver{position:absolute;right:1.2rem;bottom:1rem;font:13px 'Share Tech Mono',monospace;letter-spacing:.12em;color:rgba(255,255,255,.45)}
/* touch controls */
.touch{position:fixed;inset:0;z-index:40;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Russo One','Chakra Petch',sans-serif}
.tc-btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:1.1rem;border:2px solid rgba(255,255,255,.28);background:rgba(10,8,24,.28);color:rgba(255,255,255,.78);font-size:clamp(14px,2.4vmin,22px);letter-spacing:.12em;box-shadow:inset 0 0 1.2rem rgba(5,217,232,.12);transition:background .06s,border-color .06s,transform .06s;pointer-events:none}
.tc-btn span{pointer-events:none}
.tc-btn.on{background:rgba(5,217,232,.32);border-color:rgba(5,217,232,.9);transform:scale(.96)}
.tc-left,.tc-right{bottom:max(4vmin,env(safe-area-inset-bottom));width:16vw;max-width:9.5rem;height:34vmin;max-height:12rem;font-size:clamp(22px,5vmin,40px)}
.tc-left{left:max(3vmin,env(safe-area-inset-left))}
.tc-right{left:calc(max(3vmin,env(safe-area-inset-left)) + min(16vw,9.5rem) + 2.5vmin)}
.tc-accel,.tc-brake{bottom:max(4vmin,env(safe-area-inset-bottom));width:15vw;max-width:9rem}
.tc-accel{right:max(3vmin,env(safe-area-inset-right));height:44vmin;max-height:15rem;border-color:rgba(124,255,159,.45)}
.tc-accel.on{background:rgba(124,255,159,.3);border-color:rgba(124,255,159,.95)}
.tc-brake{right:calc(max(3vmin,env(safe-area-inset-right)) + min(15vw,9rem) + 2.5vmin);height:30vmin;max-height:10rem;border-color:rgba(255,45,149,.45)}
.tc-brake.on{background:rgba(255,45,149,.3);border-color:rgba(255,45,149,.95)}
.tc-gup,.tc-gdn{right:max(3vmin,env(safe-area-inset-right));width:15vw;max-width:9rem;height:11vmin;max-height:4rem;font-size:clamp(16px,3.4vmin,26px)}
.tc-gup{bottom:calc(max(4vmin,env(safe-area-inset-bottom)) + min(44vmin,15rem) + 2.5vmin + min(11vmin,4rem) + 1.5vmin)}
.tc-gdn{bottom:calc(max(4vmin,env(safe-area-inset-bottom)) + min(44vmin,15rem) + 2.5vmin)}
.tc-pause{top:max(3vmin,env(safe-area-inset-top));left:max(3vmin,env(safe-area-inset-left));width:11vmin;height:9vmin;max-width:4.5rem;max-height:3.4rem;border-radius:.8rem;font-size:clamp(14px,3vmin,22px)}
/* while the touch controls are up, the HUD makes room: position moves right of the pause button,
   speed and fuel move up out from under the pedals and steering */
body.touchui .hud .tl{left:calc(4vmin + min(11vmin,4.5rem))}
body.touchui .hud .br{bottom:auto;top:22%}
body.touchui .hud .bl{bottom:auto;top:30%}
.tc-rotate{display:none;position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);padding:.8rem 1.2rem;background:rgba(0,0,0,.7);border:1px solid var(--cyan);color:#fff;font:700 16px 'Chakra Petch',sans-serif;letter-spacing:.1em;pointer-events:none}
@media (orientation:portrait){.tc-rotate{display:block}}

/* menus scroll when they do not fit (phones, small windows); a swipe that starts on a button scrolls, it does not press */
.scr{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(5,217,232,.55) transparent}
.scr::-webkit-scrollbar{width:6px}
.scr::-webkit-scrollbar-thumb{background:rgba(5,217,232,.55)}
.slider{touch-action:pan-y}
/* small screens: compact spacing, content takes its natural height and the screen scrolls */
@media (max-height:620px),(max-width:760px){
  html{font-size:12px}
  #ui{--fs:clamp(12px, calc(1.6vh + .5vw), 18px)}
  .hdr{padding:.7rem 1.2rem .3rem;gap:.8rem}
  .hdr .logo{font-size:1.9rem}
  .body{flex:none;min-height:auto;padding:.5rem 1.2rem 1.2rem;gap:1rem}
  .row{min-height:2.6rem}
  .mapbox{flex:none;height:46vh;min-height:12rem}
  .carname{font-size:2.6rem}
  .hint{padding:.4rem 1.2rem .8rem;flex-wrap:wrap;gap:.4rem 1.4rem}
}
/* narrow (portrait phone): columns stack */
@media (max-width:760px){
  .body{flex-direction:column}
  .hdr .ttl{letter-spacing:.2em}
}
/* touch-first devices: the keyboard/gamepad hint bar only takes space */
@media (pointer:coarse) and (hover:none){ .hint{display:none} }
/* benchmark report */
.benchout{white-space:pre;overflow-x:auto;font-size:.78rem;line-height:1.35;margin-top:.8rem;max-height:none}
.benchchart{width:100%;height:auto;margin-top:.8rem;background:rgba(0,0,0,.35);border:1px solid rgba(5,217,232,.25)}
.benchbtns{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem}

/* car selection: usable by touch and on small screens */
.carsel{overflow:hidden;touch-action:none}
.carinfo{position:absolute;left:3rem;bottom:14vh;max-width:min(30rem,44vw)}
.carblurb{max-width:28rem;margin-top:.8rem;font-size:.95rem}
.carstats{margin-top:1.2rem;width:min(30rem,44vw)}
.carbtns{position:absolute;right:3rem;bottom:14vh;display:flex;gap:.8rem;align-items:center}
.carhint{position:absolute;left:0;right:0;bottom:0}
.cararrow{position:absolute;top:22%;bottom:38%;width:16vw;min-width:4.5rem;display:flex;align-items:center;font-family:'Russo One';font-size:4rem;color:var(--cyan);opacity:.75;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cararrow.l{left:0;justify-content:flex-start;padding-left:2rem}
.cararrow.r{right:0;justify-content:flex-end;padding-right:2rem}
.cararrow:active{opacity:1;transform:scale(1.12)}
.carsel .swatches{flex-wrap:wrap;max-width:min(30rem,44vw)}
.carsel .swatches i{cursor:pointer;touch-action:manipulation}
.carsel .swatches i.taken{opacity:.25;cursor:default}
@media (max-height:620px),(max-width:820px){
  .carinfo{left:1rem;bottom:3.2rem}
  .carbtns{right:1rem;bottom:3.2rem}
  .carblurb{display:none}
  .carstats{margin-top:.5rem}
  .carsel .swatches i{width:1.9rem;height:1.9rem}
  .cararrow{font-size:2.6rem;top:18%;bottom:45%}
  .cararrow.l{padding-left:.8rem}.cararrow.r{padding-right:.8rem}
}
@media (pointer:coarse){.carhint{display:none}}
